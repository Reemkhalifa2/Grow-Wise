services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: investment-backend

    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:mysql://host.docker.internal:3306/InvestmentGoalManagementDB?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile

    container_name: investment-frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "4200:80"