spring.application.name=InvestmentGoalManagementPlatform
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=ThisIsASecretKeyForJwtThatMustBeAtLeast32CharsLong
jwt.expiration=3600000

# OAuth 2.0 Web client ID from Google Cloud Console. Must match the client ID
# the Angular app initialises Google Identity Services with.
google.oauth.client-id=${GOOGLE_CLIENT_ID}


spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.openai.api-key=${OPENAI_API_KEY}