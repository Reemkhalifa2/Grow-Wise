<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Welcome back</title>
<link rel="stylesheet" href="login.css" />
</head>
<body>

  <div class="toast" id="toast"></div>

  <main class="page">
    <div class="brand">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 3L20 12L13 21" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20 12H4" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to your account</p>
    </div>

    <div class="card">
      <button type="button" class="btn-google" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.9 6 29.7 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.9 6 29.7 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.6 0 10.7-1.9 14.6-5.1l-6.7-5.7C29.8 34.9 27 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.6 39.6 16.3 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4 5.6l6.7 5.7C41.2 36.4 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div class="divider">
        <span>OR</span>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <div class="input-wrap" id="emailWrap">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 6.5L11.2 12.4C11.7 12.75 12.3 12.75 12.8 12.4L21 6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/>
            </svg>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
          </div>
          <div class="error-text" id="emailError"></div>
        </div>

        <div class="field">
          <div class="field-label-row">
            <label for="password">Password</label>
            <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
          </div>
          <div class="input-wrap" id="passwordWrap">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M8 10V7a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
          </div>
          <div class="error-text" id="passwordError"></div>
        </div>

        <button type="submit" class="btn-submit" id="loginBtn">
          <span class="btn-label">Log in</span>
        </button>
      </form>
    </div>

    <p class="signup-row">Don't have an account? <a href="#" id="createAccountLink">Create one</a></p>
  </main>

<script src="script.js"></script>
</body>
</html>
