<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password</title>
<link rel="stylesheet" href="ForgetPassword.css" />
</head>
<body>

  <div class="toast" id="toast"></div>

  <main class="page">
    <div class="brand">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="5" width="18" height="14" rx="2" stroke="white" stroke-width="2"/>
          <path d="M3 7l9 6 9-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Reset password</h1>
      <p class="subtitle">We'll send you a link to reset it</p>
    </div>

    <div class="card">
      <form id="resetForm" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <div class="input-wrap" id="emailWrap">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 6.5L11.2 12.4C11.7 12.75 12.3 12.75 12.8 12.4L21 6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/>
            </svg>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
          </div>
          <div class="error-text" id="emailError"></div>
        </div>

        <button type="submit" class="btn-submit" id="sendBtn">
          <span class="btn-label">Send reset link</span>
        </button>
      </form>
    </div>

    <p class="back-row">
      <a href="index.html" id="backLink">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back to log in
      </a>
    </p>
  </main>

<script src="reset-password.js"></script>
</body>
</html>
