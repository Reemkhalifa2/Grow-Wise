<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Invalid reset link</title>
<link rel="stylesheet" href="ResetPassword.css" />
</head>
<body>

  <div class="toast" id="toast"></div>

  <main class="page">
    <div class="brand">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 4l9 16H3l9-16z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
          <path d="M12 10v4M12 17v.01" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 id="pageTitle">Invalid reset link</h1>
      <p class="subtitle" id="pageSubtitle">This password reset link is missing or invalid</p>
    </div>

    <div class="card message-card">
      <p class="message-text" id="messageText">
        The link you used appears to be incomplete. Please request a new password reset email.
      </p>
    </div>

    <p class="signup-row">
      <a href="reset-password.html" id="requestNewLink">Request a new link</a>
    </p>
  </main>

<script src="invalid-reset.js"></script>
</body>
</html>
