<main class="page">

  <app-page-header
    eyebrow="Settings"
    title="Account settings"
    subtitle="Your account details on GlowWise."
  ></app-page-header>

  <section class="card">
    <div class="row">
      <span>Full name</span>
      <strong>{{ fullName }}</strong>
    </div>

    <div class="row">
      <span>Email</span>
      <strong>{{ email }}</strong>
    </div>

    <div class="row">
      <span>Role</span>
      <strong>{{ role }}</strong>
    </div>
  </section>

  <section class="card muted-card">
    <p>
      Notification preferences, security settings, and connected accounts
      are coming soon.
    </p>
  </section>

</main>
