<header class="topbar">

  <div class="topbar-date">
    {{ currentDate }}
  </div>

  <div class="topbar-user">
    <div class="user-info">
      <div class="user-name">
        {{ fullName }}
      </div>

      <div class="user-role">
        {{ role }}
      </div>
    </div>

    <div class="user-avatar">
      {{ initials }}
    </div>
  </div>

</header>
