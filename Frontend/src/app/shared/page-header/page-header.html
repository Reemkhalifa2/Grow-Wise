<header class="page-header">
  <div>
    @if (eyebrow) {
      <span class="eyebrow">{{ eyebrow }}</span>
    }

    <h1>{{ title }}</h1>

    @if (subtitle) {
      <p class="subtitle">{{ subtitle }}</p>
    }
  </div>

  <div class="actions">
    <ng-content select="[actions]"></ng-content>
  </div>
</header>
