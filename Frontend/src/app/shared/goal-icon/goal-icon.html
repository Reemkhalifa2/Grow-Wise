@switch (icon) {
  @case ('car') {
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <path d="M4 16V11l2-5h12l2 5v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M3 16h18v2a1 1 0 01-1 1h-2a1 1 0 01-1-1v-1H7v1a1 1 0 01-1 1H4a1 1 0 01-1-1v-2z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
      <circle cx="7.5" cy="16" r="1.3" fill="currentColor" />
      <circle cx="16.5" cy="16" r="1.3" fill="currentColor" />
    </svg>
  }
  @case ('home') {
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <path d="M4 11l8-7 8 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M6 10v9a1 1 0 001 1h10a1 1 0 001-1v-9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M10 20v-6h4v6" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
    </svg>
  }
  @case ('travel') {
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <path d="M10.5 20.5L12 17l1.5 3.5M12 17V3.5l7.5 4.7c.5.3.5 1 0 1.3L12 12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M12 12L4.5 9.5c-.5-.3-.5-1 0-1.3L7 6.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  }
  @case ('education') {
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <path d="M2 8l10-4.5L22 8l-10 4.5L2 8z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
      <path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  }
  @case ('savings') {
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <path d="M5 12c0-4 3.5-7 8-7 3 0 5 1.5 6 3.2l1.6.4a.7.7 0 01.1 1.3l-1.5.7-.6 2.4-1.6.3-.6 2.2H12l-.6-2H8.5C7 15 5 13.8 5 12z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
      <circle cx="9.5" cy="10" r="0.8" fill="currentColor" />
    </svg>
  }
  @default {
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7" />
      <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.7" />
      <circle cx="12" cy="12" r="1" fill="currentColor" />
    </svg>
  }
}
