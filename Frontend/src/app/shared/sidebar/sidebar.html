<aside class="sidebar">

  <div class="sidebar-brand">
    <div class="brand-icon">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M4 20V10M11 20V4M18 20V13"
          stroke="white"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <div>
      <div class="brand-name">
        GlowWise
      </div>

      <div class="brand-tagline">
        Invest with direction
      </div>
    </div>
  </div>

  <nav class="nav-group">

    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item"
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
      >
        <rect
          x="3"
          y="3"
          width="7"
          height="7"
          rx="1.5"
          stroke="currentColor"
          stroke-width="1.6"
        />

        <rect
          x="14"
          y="3"
          width="7"
          height="7"
          rx="1.5"
          stroke="currentColor"
          stroke-width="1.6"
        />

        <rect
          x="3"
          y="14"
          width="7"
          height="7"
          rx="1.5"
          stroke="currentColor"
          stroke-width="1.6"
        />

        <rect
          x="14"
          y="14"
          width="7"
          height="7"
          rx="1.5"
          stroke="currentColor"
          stroke-width="1.6"
        />
      </svg>

      <span>Overview</span>
    </a>

    <a
      routerLink="/financial-profile"
      routerLinkActive="active"
      class="nav-item"
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
      >
        <circle
          cx="12"
          cy="8"
          r="3.5"
          stroke="currentColor"
          stroke-width="1.6"
        />

        <path
          d="M5 20c0-4 3.1-7 7-7s7 3 7 7"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
      </svg>

      <span>Financial profile</span>
    </a>

    <a
      routerLink="/goals"
      routerLinkActive="active"
      class="nav-item"
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
      >
        <circle
          cx="12"
          cy="12"
          r="9"
          stroke="currentColor"
          stroke-width="1.6"
        />

        <circle
          cx="12"
          cy="12"
          r="4.5"
          stroke="currentColor"
          stroke-width="1.6"
        />

        <circle
          cx="12"
          cy="12"
          r="1"
          fill="currentColor"
        />
      </svg>

      <span>Investment goal</span>
    </a>

    <a
      routerLink="/investment-plan"
      routerLinkActive="active"
      class="nav-item"
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M12 3l1.8 4.5L18 9l-4.2 1.7L12 15l-1.8-4.3L6 9l4.2-1.5L12 3z"
          stroke="currentColor"
          stroke-width="1.5"
        />
      </svg>

      <span>AI plan</span>
    </a>

    <a
      routerLink="/portfolio"
      routerLinkActive="active"
      class="nav-item"
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
      >
        <rect
          x="3"
          y="7"
          width="18"
          height="13"
          rx="2"
          stroke="currentColor"
          stroke-width="1.6"
        />

        <path
          d="M8 7V5.5A1.5 1.5 0 019.5 4h5A1.5 1.5 0 0116 5.5V7"
          stroke="currentColor"
          stroke-width="1.6"
        />
      </svg>

      <span>Portfolio</span>
    </a>

    <a
      routerLink="/history"
      routerLinkActive="active"
      class="nav-item"
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
      >
        <circle
          cx="12"
          cy="12"
          r="9"
          stroke="currentColor"
          stroke-width="1.6"
        />

        <path
          d="M12 7v5l3.5 2"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
      </svg>

      <span>History</span>
    </a>

  </nav>

  @if (isAdmin) {
    <div class="nav-section-label">
      Administration
    </div>

    <nav class="nav-group">

      <a
        routerLink="/admin-dashboard"
        routerLinkActive="active"
        class="nav-item"
      >
        <span>Admin overview</span>
      </a>

      <a
        routerLink="/admin-assets"
        routerLinkActive="active"
        class="nav-item"
      >
        <span>Assets</span>
      </a>

      <a
        routerLink="/market-data"
        routerLinkActive="active"
        class="nav-item"
      >
        <span>Market data</span>
      </a>

    </nav>
  }

  <button
    type="button"
    class="logout-button"
    (click)="logout()"
  >
    Log out
  </button>

</aside>
