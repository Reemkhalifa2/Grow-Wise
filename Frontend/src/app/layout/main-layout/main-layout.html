<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path
            d="M4 20V10M11 20V4M18 20V13"
            stroke="white"
            stroke-width="2.2"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <div>
        <div class="brand-name">GlowWise</div>
        <div class="brand-tagline">Invest with direction</div>
      </div>
    </div>

    <nav class="nav-group">
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
      >
        <span class="nav-icon">▦</span>
        <span>Overview</span>
      </a>

      <a
        routerLink="/profile"
        routerLinkActive="active"
        class="nav-item"
      >
        <span class="nav-icon">◯</span>
        <span>Financial profile</span>
      </a>

      <a
        routerLink="/goals"
        routerLinkActive="active"
        class="nav-item"
      >
        <span class="nav-icon">◎</span>
        <span>Investment goal</span>
      </a>

      <a
        routerLink="/investment-plan"
        routerLinkActive="active"
        class="nav-item"
      >
        <span class="nav-icon">✦</span>
        <span>AI plan</span>
      </a>

      <a
        routerLink="/portfolio"
        routerLinkActive="active"
        class="nav-item"
      >
        <span class="nav-icon">▣</span>
        <span>Portfolio</span>
      </a>
    </nav>

    @if (isAdmin) {
      <div class="nav-section-label">
        Administration
      </div>

      <nav class="nav-group">
        <a
          routerLink="/admin-dashboard"
          routerLinkActive="active"
          class="nav-item"
        >
          <span class="nav-icon">◇</span>
          <span>Admin overview</span>
        </a>

        <a
          routerLink="/admin-assets"
          routerLinkActive="active"
          class="nav-item"
        >
          <span class="nav-icon">▤</span>
          <span>Assets</span>
        </a>
      </nav>
    }

    <button
      type="button"
      class="logout-button"
      (click)="logout()"
    >
      <span>↪</span>
      Log out
    </button>
  </aside>

  <section class="workspace">

    <header class="topbar">
      <div>
        <div class="page-label">Investment platform</div>
        <div class="topbar-date">{{ currentDate }}</div>
      </div>

      <div class="topbar-user">
        <div class="user-info">
          <div class="user-name">{{ fullName }}</div>
          <div class="user-role">{{ role }}</div>
        </div>

        <div class="user-avatar">
          {{ initials }}
        </div>
      </div>
    </header>

    <main class="page-area">
      <router-outlet></router-outlet>
    </main>

  </section>
</div>
